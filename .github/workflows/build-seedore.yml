name: Build SeedOre 1.21.11

on:
  workflow_dispatch:
  push:
    branches:
      - seedore-1.21.11
    paths:
      - '**.java'
      - '**.gradle'
      - '**.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'fabric/src/**'
      - '.github/workflows/build-seedore.yml'

permissions:
  contents: read

concurrency:
  group: seedore-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Fabric mod (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile and remap Fabric JAR
        run: ./gradlew :fabric:remapJar --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: seedore-baritone-1.21.11
          path: fabric/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
